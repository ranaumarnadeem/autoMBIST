name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (coverage gate)
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Install Nix and run the whole suite inside the flake's dev shell, so the
      # EDA toolchain (iverilog 13.0, verilator 5.048, yosys 0.62) and Python env
      # (cocotb 2.x, pytest, ...) are pinned to the exact versions in flake.lock.
      # This replaces the old `apt-get install iverilog verilator yosys`, whose
      # drifting versions caused "passes locally, fails in CI" breakage and made
      # the integration tests silently skip. Upstream tools come prebuilt from
      # cache.nixos.org; magic-nix-cache avoids re-downloading the closure.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # Two DIFFERENT caches, both content-addressed internally, so a stale
      # restore is harmless -- neither depends on this key beyond "give me
      # back whatever accumulated last time; entries that no longer match
      # anything just sit unused until GitHub's own cache eviction reclaims
      # them" (per-repo actions/cache storage is capped at 10GB, LRU-evicted
      # automatically, so this is not unbounded):
      #   ~/.cache/ccache             -- OBJCACHE=ccache (flake.nix's devShell
      #                                  shellHook), speeds up verilator's own
      #                                  internal C++ compile step even when
      #                                  the layer below misses (e.g. a
      #                                  different memory geometry still
      #                                  shares verilator's runtime library
      #                                  translation units).
      #   /tmp/autombist-engine-cache -- compile_engine's own content-
      #                                  addressed build cache (see
      #                                  algo_engine.py's _engine_build_cache_key)
      #                                  -- a full hit skips calling verilator
      #                                  at all, not just its C++ step.
      - name: Cache verilator build artifacts (ccache + engine build cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            /tmp/autombist-engine-cache
          key: ${{ runner.os }}-autombist-buildcache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-autombist-buildcache-

      - name: Run test suite with coverage gate
        run: |
          nix develop --command \
            pytest tests/software tests/integration \
              --cov=autombist --cov-report=term-missing --cov-fail-under=90

  # The same suite in the same flake dev shell on Apple Silicon macOS (Intel macOS
  # is out: nixpkgs' iverilog does not build for x86_64-darwin). The coverage gate
  # stays with the Linux job, since the suite and so its coverage are the same.
  # The first run builds cocotb, which the flake un-marks as broken on darwin and
  # so cache.nixos.org does not have; magic-nix-cache keeps it after that.
  pytest-macos:
    name: pytest (macOS)
    runs-on: macos-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      # ccache's default directory on macOS is ~/Library/Caches/ccache.
      - name: Cache verilator build artifacts (ccache + engine build cache)
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/ccache
            /tmp/autombist-engine-cache
          key: ${{ runner.os }}-autombist-buildcache-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-autombist-buildcache-

      - name: Run test suite
        run: |
          nix develop --command pytest tests/software tests/integration
