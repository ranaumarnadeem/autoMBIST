# Reference configs for tests/software/test_golden_rtl.py.
#
# Each case is a config as a user writes it, plus the options `generate` is given
# (the generate_from_config keywords: algo, use_saboteur, faults, fault_seed,
# fault_type). tests/golden/<case>/ holds what generate writes for it, except the
# rtl/ sources it only copies (listed in rtl_copied.txt instead), the config.yml
# snapshot, and the saboteur's random fault lists.
#
# Add a case for every new template branch. After an intended change to the
# output, regenerate and review the diff:
#   AUTOMBIST_UPDATE_GOLDEN=1 python -m pytest tests/software/test_golden_rtl.py

march-c:
  generate: {algo: march-c}
  config:
    memory_name: sram_1rw
    wrapper_module_name: sram_1rw_mbist
    addr_width: 4
    data_width: 8
    we_active_low: true
    ports: {clk: clk0, addr: addr0, din: din0, dout: dout0, we: web0, csb: csb0}

