name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (coverage gate)
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Install Nix and run the whole suite inside the flake's dev shell, so the
      # EDA toolchain (iverilog 13.0, verilator 5.048, yosys 0.62) and Python env
      # (cocotb 2.x, pytest, ...) are pinned to the exact versions in flake.lock.
      # This replaces the old `apt-get install iverilog verilator yosys`, whose
      # drifting versions caused "passes locally, fails in CI" breakage and made
      # the integration tests silently skip. Upstream tools come prebuilt from
      # cache.nixos.org; magic-nix-cache avoids re-downloading the closure.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Enable Nix binary cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Run test suite with coverage gate
        run: |
          nix develop --command \
            pytest tests/software tests/integration \
              --cov=autombist --cov-report=term-missing --cov-fail-under=90
