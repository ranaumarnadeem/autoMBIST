[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autombist"
version = "0.1.0"
description = "Open-source MBIST, BIRA and BISR generator for OpenRAM memories, with a march-algorithm research platform"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Rana Umar Nadeem" }]
keywords = [
  "mbist", "memory-bist", "bist", "bira", "bisr", "march-test", "openram", "sky130",
  "librelane", "dft", "design-for-test", "eda", "verilog", "open-source-hardware",
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "typer[all]>=0.12",
  "cocotb>=2.0",
  "cocotb-tools>=0.1.0",
]

[project.optional-dependencies]
hardware-test = [
  "cocotb>=2.0",
  "cocotb-tools>=0.1.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]
test-access = [
  # `autombist wrap-test-access` (src/autombist/testaccess.py): wraps a generated
  # wrapper's control/status ports with a JTAG/IJTAG (IEEE 1149.1/1687) test-access
  # network. Optional, not core -- testaccess.py is import-guarded exactly like
  # tcl_shell.py's tkinter dependency, so its absence never breaks the rest of the CLI.
  # Also needs a real Yosys and Icarus Verilog on PATH at runtime (warptap shells out
  # to both; this extra covers only the Python side).
  "warptap>=0.0.2",  # 0.0.2 fixes a width>1 AssertionError in the vendored icl_parser
  # `--emit-icl`'s BSDL and `--idcode` need warptap 0.0.3 (warptap.bsdl_emit, idcode_value);
  # with 0.0.2 they refuse with an upgrade message. The Nix devShell (so CI) pins 0.0.3 in
  # flake.lock. This floor stays 0.0.2 because 0.0.3 is tagged on GitHub but not published
  # to PyPI yet: raise it to 0.0.3 once it is (TODO.md).
]

[project.scripts]
autombist = "autombist.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autombist"]

[tool.hatch.build.targets.wheel.force-include]
"rtl" = "autombist/rtl"
"tests" = "autombist/tests"
# `autombist ram-synth` shells out to scripts/synthesize_sram.py at runtime
# (openram_flow._synthesize_sram_script). Without this the command was broken
# for every non-editable install: the helper was never in the wheel.
"scripts" = "autombist/scripts"

[project.urls]
Homepage = "https://github.com/ranaumarnadeem/autoMBIST"
Repository = "https://github.com/ranaumarnadeem/autoMBIST"
Documentation = "https://ranaumarnadeem.github.io/autoMBIST/"
Issues = "https://github.com/ranaumarnadeem/autoMBIST/issues"

[tool.pytest.ini_options]
markers = [
  "faultflow: needs a built FaultFlow repo + Yosys on PATH (grade-controller tests)",
]
