name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (coverage gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install EDA toolchain (best-effort; tool-gated tests skip cleanly if absent)
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys

      - name: Install package + dev dependencies
        run: python -m pip install -e ".[hardware-test]" pytest pytest-cov

      - name: Run test suite with coverage gate
        run: |
          python -m pytest tests/software tests/integration \
            --cov=autombist --cov-report=term-missing --cov-fail-under=90
