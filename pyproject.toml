[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "autombist"
version = "1.1.2"
description = "MBIST wrapper and fault-flow generator"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "typer[all]>=0.12",
  "cocotb>=2.0",
  "cocotb-tools>=0.1.0",
]

[project.optional-dependencies]
hardware-test = [
  "cocotb>=2.0",
  "cocotb-tools>=0.1.0",
]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
]

[project.scripts]
autombist = "autombist.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/autombist"]

[tool.hatch.build.targets.wheel.force-include]
"rtl" = "autombist/rtl"
"tests" = "autombist/tests"

[project.urls]
Homepage = "https://github.com/ranaumarnadeem/autoMBIST"
Repository = "https://github.com/ranaumarnadeem/autoMBIST"
Issues = "https://github.com/ranaumarnadeem/autoMBIST/issues"

[tool.pytest.ini_options]
markers = [
  "hardware: needs Icarus Verilog/Verilator/cocotb on PATH (tests/hardware, tests/integration)",
  "faultflow: needs a built FaultFlow repo + Yosys on PATH (grade-controller tests)",
]
